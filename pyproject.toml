[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "friendly-document-extractor"
version = "0.1.0"
description = "CLI guide pour archiver les pages image d'un document autorise"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["playwright>=1.45,<2"]

[project.optional-dependencies]
pdf = ["img2pdf>=0.5.1,<1"]

[project.scripts]
document-extractor = "document_extractor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

