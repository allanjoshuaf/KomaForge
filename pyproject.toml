[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "komaforge"
version = "0.2.0"
description = "Extracteur CLI de publications web vers CBZ, PDF, EPUB ou images"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Ashkel"}]
keywords = ["manga", "comic", "cbz", "cbr", "epub", "extractor"]
dependencies = ["playwright>=1.45,<2"]

[project.urls]
Homepage = "https://github.com/Ashkel/KomaForge"
Repository = "https://github.com/Ashkel/KomaForge"
Issues = "https://github.com/Ashkel/KomaForge/issues"

[project.optional-dependencies]
pdf = ["img2pdf>=0.5.1,<1"]

[project.scripts]
komaforge = "document_extractor.cli:main"
document-extractor = "document_extractor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
