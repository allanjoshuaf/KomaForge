name: Windows portable

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -e ".[pdf,conversion]" "pyinstaller>=6,<7" pytest
      - name: Test sources
        env:
          RUN_EXTRACTOR_E2E: "1"
        run: python -m pytest -q
      - name: Build portable
        run: python scripts/build_windows.py
      - name: Test portable
        shell: pwsh
        run: |
          $app = (Get-ChildItem -LiteralPath dist -Filter KomaForge.exe -File -Recurse | Select-Object -First 1).FullName
          python scripts/smoke_windows.py $app --output tmp/portable-smoke
      - uses: actions/upload-artifact@v4
        with:
          name: KomaForge-windows-x64
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
